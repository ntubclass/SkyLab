<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>AI PVE Template Test</title>
    <style>
      :root { color-scheme: dark; font-family: system-ui, sans-serif; }
      body { max-width: 980px; margin: 0 auto; padding: 24px; background: #111827; color: #e5e7eb; }
      h1 { margin-top: 0; }
      label { display: block; margin: 12px 0 6px; color: #cbd5e1; }
      input, select, textarea, button { box-sizing: border-box; width: 100%; padding: 9px 10px; border: 1px solid #475569; border-radius: 6px; background: #0f172a; color: inherit; }
      textarea { min-height: 110px; resize: vertical; }
      button { width: auto; margin-top: 12px; cursor: pointer; background: #1d4ed8; border-color: #2563eb; }
      button:disabled { cursor: wait; opacity: .55; }
      button.secondary { background: #334155; border-color: #64748b; }
      button.danger { background: #991b1b; border-color: #dc2626; }
      .grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; }
      .card { margin-top: 18px; padding: 16px; border: 1px solid #334155; border-radius: 8px; background: #1e293b; }
      .muted { color: #94a3b8; }
      pre { overflow: auto; max-height: 320px; padding: 12px; background: #020617; border-radius: 6px; white-space: pre-wrap; }
      .tool { margin: 10px 0; padding: 10px; border-left: 3px solid #60a5fa; background: #0f172a; }
      .pending { border-left-color: #f59e0b; }
      .row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
      .target-list { display: grid; gap: 12px; }
      .target-row { display: grid; grid-template-columns: auto minmax(70px, .35fr) minmax(0, 1.2fr); gap: 8px 12px; align-items: center; padding: 12px; border: 1px solid #334155; border-radius: 6px; }
      .target-row strong { grid-row: span 2; color: #bfdbfe; }
      .target-row label { margin: 0; font-size: .85rem; }
      .target-row input, .target-row select { width: 100%; }
      .status { margin: 12px 0; padding: 12px 14px; border-radius: 8px; border: 1px solid #475569; background: #172033; }
      .status[data-kind="confirmation"] { border-color: #f59e0b; color: #fde68a; }
      .status[data-kind="error"] { border-color: #ef4444; color: #fecaca; }
      .loading { display: flex; align-items: center; gap: 10px; color: #bfdbfe; }
      .spinner { width: 16px; height: 16px; border: 2px solid #475569; border-top-color: #60a5fa; border-radius: 50%; animation: spin .8s linear infinite; }
      .confirmation-heading { display: flex; justify-content: space-between; gap: 12px; align-items: baseline; }
      .confirmation-vmid { color: #fbbf24; font-size: .9rem; }
      .confirmation-note { margin: 0 0 10px; color: #fde68a; }
      .confirmation-result { border: 1px solid #334155; }
      @keyframes spin { to { transform: rotate(360deg); } }
      @media (max-width: 700px) { .grid { grid-template-columns: 1fr; } .target-row { grid-template-columns: 1fr 1.5fr; } .target-row strong { grid-column: 1 / -1; grid-row: auto; } }
    </style>
  </head>
  <body>
    <h1>AI PVE Template Test</h1>
      <p class="muted">多機模板測試入口（最多三台）。填入幾台就測試幾台；空白槽位會被忽略。初始 AI 上下文來自選取的模板，所有授權、guard、SSH key 與 scope 驗證由 backend 負責。</p>

    <div class="card">
      <div class="grid">
        <div>
          <label for="apiBase">Backend API base</label>
          <input id="apiBase" value="http://localhost:18200/api/v1" autocomplete="off" />
        </div>
        <div>
          <label for="token">Access token（只保留在記憶體）</label>
          <input id="token" type="password" autocomplete="off" />
        </div>
      </div>
      <div class="target-list">
        <div class="target-row">
          <strong>機器 1</strong>
          <label for="target1Vmid">VMID</label>
          <input id="target1Vmid" class="target-vmid" inputmode="numeric" placeholder="例如 102" autocomplete="off" />
          <label for="target1Template">機器模板</label>
          <select id="target1Template" class="target-template"><option value="">先載入模板</option></select>
        </div>
        <div class="target-row">
          <strong>機器 2</strong>
          <label for="target2Vmid">VMID</label>
          <input id="target2Vmid" class="target-vmid" inputmode="numeric" placeholder="例如 107" autocomplete="off" />
          <label for="target2Template">機器模板</label>
          <select id="target2Template" class="target-template"><option value="">先載入模板</option></select>
        </div>
        <div class="target-row">
          <strong>機器 3</strong>
          <label for="target3Vmid">VMID</label>
          <input id="target3Vmid" class="target-vmid" inputmode="numeric" placeholder="例如 115" autocomplete="off" />
          <label for="target3Template">機器模板</label>
          <select id="target3Template" class="target-template"><option value="">先載入模板</option></select>
        </div>
      </div>
      <div class="row">
        <button id="loadTemplates" class="secondary">載入模板</button>
      </div>
    </div>

    <div class="card">
      <label for="message">自然語言任務</label>
      <textarea id="message" placeholder="例如：先確認 n8n 是否在 5678 連接埠提供 HTTP 回應。"></textarea>
      <button id="send">送出任務</button>
    </div>

    <div id="confirmation" class="card" hidden>
      <div class="confirmation-heading"><h2>AI 請求確認</h2><span id="confirmationVmid" class="confirmation-vmid"></span></div>
      <p class="confirmation-note">AI 判斷這個指令可能會修改環境，執行前需要你的明確同意。</p>
      <p id="confirmationReason" class="muted"></p>
      <pre id="confirmationCommand"></pre>
      <button id="approve">允許執行</button>
      <button id="reject" class="danger">拒絕</button>
    </div>

    <div id="result" class="card">
      <h2>結果</h2>
      <div id="loading" class="loading" hidden role="status" aria-live="polite"><span class="spinner" aria-hidden="true"></span><span id="loadingMessage">AI 載入中…</span></div>
      <div id="aiStatus" class="status" hidden role="status" aria-live="polite"></div>
      <div id="reply" class="muted">尚未送出任務。</div>
      <div id="tools"></div>
    </div>

    <script type="module" src="./app.js"></script>
  </body>
</html>
